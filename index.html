<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <!-- Keep this list to the origins the first load actually hits: extra
         preconnects compete for the same connection budget. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://data.jsdelivr.com" crossorigin />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intlayer online IDE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
